name: Veduci integration

on:
  pull_request:
    paths:
      - "app.py"
      - "integrations/**"
      - "models.py"
      - "tests/test_veduci_integration.py"
      - ".github/workflows/veduci-integration.yml"
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "integrations/**"
      - "models.py"
      - "tests/test_veduci_integration.py"
      - ".github/workflows/veduci-integration.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install integration test dependencies
        run: >-
          python -m pip install
          Flask==3.0.3
          Flask-Login==0.6.3
          Flask-SQLAlchemy==3.1.1
          Flask-Mail==0.9.1
          pytest==8.4.2

      - name: Run integration contract tests
        run: python -m pytest -q tests/test_veduci_integration.py
