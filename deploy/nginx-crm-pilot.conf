# Include only inside the existing HTTPS server block for invoicemakerai.com.
# Keep existing InvoiceMaker locations and certificates unchanged.
location = /remeselnici {
    return 308 /remeselnici/;
}

location ^~ /remeselnici/ {
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:8098/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /remeselnici;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_read_timeout 70s;
    proxy_redirect off;
}
