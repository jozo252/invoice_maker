<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Prihlásenie — InvoiceMakerAI CRM</title><link rel="icon" href="{{ url_for('static',filename='crm/favicon.svg') }}"><link rel="stylesheet" href="{{ url_for('static',filename='crm/crm.css') }}"></head><body><header class="topbar"><a class="brand" href="{{ url_for('pilot_login') }}"><span class="brand-icon">I</span><span>InvoiceMaker<span class="brand-ai">AI</span></span><small>CRM PRE REMESELNÍKOV</small></a><span class="pilot">Súkromný pilot</span></header><main class="workspace narrow"><div class="heading"><div><p class="eyebrow">AJ V TERÉNE</p><h1>Vaše zákazky po ruke.</h1><p>Prihláste sa prístupovým kódom.</p></div></div><section class="panel padded">{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Prístupový kód<input name="access_code" type="password" required maxlength="128" autocomplete="current-password" autocapitalize="none" spellcheck="false"></label><button class="btn dark">Otvoriť CRM</button></form></section></main></body></html>
