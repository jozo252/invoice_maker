{% extends 'crm/base.html' %}{% block content %}<a class="back" href="{{ url_for('crm.index') }}">← Všetky zákazky</a><div class="heading"><div><p class="eyebrow">NOVÁ PRÁCA</p><h1>Založiť zákazku.</h1><p>Cenu aj termín môžete zatiaľ nechať prázdne.</p></div></div>{% if not clients %}<div class="notice">Najprv <a href="{{ url_for('crm.clients') }}">pridajte zákazníka</a>.</div>{% else %}<section class="panel padded narrow"><form class="form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Názov zákazky<input name="title" maxlength="255" required placeholder="Napr. Elektroinštalácia rodinného domu" value="{{ request.form.get('title','') }}"></label><label>Zákazník<select name="client_id" required>{% for client in clients %}<option value="{{ client.id }}" {% if request.form.get('client_id')==client.id|string %}selected{% endif %}>{{ client.name }}</option>{% endfor %}</select></label><div class="form-row"><label>Dohodnutá cena (€)<input name="price" inputmode="decimal" placeholder="Zatiaľ nezadaná" value="{{ request.form.get('price','') }}"></label><label>Termín<input name="due_date" type="date" value="{{ request.form.get('due_date','') }}"></label></div><label>Poznámky / miesto realizácie<textarea name="description" maxlength="3000" rows="4">{{ request.form.get('description','') }}</textarea></label><div class="actions"><a class="btn" href="{{ url_for('crm.index') }}">Zrušiť</a><button class="btn dark">Uložiť zákazku</button></div></form></section>{% endif %}{% endblock %}
