{% extends "base.html" %}

{% block content %}
<meta name="csrf-token" content="{{ csrf_token() }}">

<div class="container py-5">
  <h1 class="mb-4">ReplyBot</h1>
  <div class="mb-3">
    <label for="input" class="form-label">Zadajte text pre generovanie odpovedi:</label>
    <textarea id="input" class="form-control" rows="4"></textarea>
  </div>
  <button class="btn btn-primary mb-3" onclick="generate()">Generovat odpoved</button>
  <div class="mb-3">
    <label for="output" class="form-label">Vygenerovaná odpověď:</label>
    <textarea id="output" class="form-control" rows="4" readonly></textarea>
  </div>
  <button class="btn btn-secondary" onclick="copy()">Kopírovat do schránky</button>

<script>
async function generate() {
  const input = document.getElementById("input").value;
  const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute("content");

  const res = await fetch("/generate-reply", {
    method: "POST",
    
    headers: {"Content-Type": "application/x-www-form-urlencoded",
              "X-CSRFToken": csrfToken},
    body: "input=" + encodeURIComponent(input)
  });

  const data = await res.json();
  document.getElementById("output").value = data.reply;
}

function copy() {
  const output = document.getElementById("output");
  output.select();
  document.execCommand("copy");
}
</script>
{% endblock %}
